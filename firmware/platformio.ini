; PlatformIO Project Configuration File
; ESP32-S3 Module firmware
; Interactive hardware self-test over USB serial (firmware/src/main.cpp).
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The USB-C connector is wired to the ESP32-S3 native USB pins, so the
; self-test talks to the PC over USB CDC instead of the UART0 pins.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    h2zero/NimBLE-Arduino@^1.4.3
