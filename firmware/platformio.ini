; PlatformIO Project Configuration File
; ESP32-S3 Module firmware
; Interactive hardware self-test over USB serial (firmware/src/main.cpp).
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The USB-C connector is wired to the ESP32-S3 native USB pins, so the
; self-test talks to the PC over USB CDC instead of the UART0 pins.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    ; NimBLE 2.3.9+ is required on Arduino core 3.3.7+: older 1.4.x crashes
    ; the ESP32-S3 with "Stack canary watchpoint triggered (ipc0)" on init.
    h2zero/NimBLE-Arduino@^2.3.9
